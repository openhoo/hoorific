[package]
name = "hoorific-codex-wire"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hoorific-codex-wire"
path = "src/main.rs"

[dependencies]
http = { version = "=1.4.0", default-features = false }
hyper = { version = "=1.8.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
hyper-tls = { version = "=0.6.0", default-features = false }
native-tls = { version = "=0.2.14", features = ["vendored"] }
openssl = { version = "=0.10.75", features = ["vendored"] }
openssl-sys = { version = "=0.9.111", features = ["vendored"] }
# Cargo.lock fixes this package to 300.6.1+3.6.3 (OpenSSL 3.6.3).
openssl-src = { version = "=300.6.1" }
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149" }
tokio = { version = "=1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
