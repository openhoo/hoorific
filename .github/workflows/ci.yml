name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Keep a main publication run alive while a screenshot-refresh push queues
  # the next CI run. PR and non-publication runs may still be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOTOOLCHAIN: local
  HOORIFIC_VERIFY_PYTHON: python
  PLAYWRIGHT_SKIP_BROWSER_GC: "1"

jobs:
  verify:
    name: Build and qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The schema stage intentionally imports only the admin/core packages. Keep
      # this order: generated console code and assets must exist before Go checks
      # or a runtime build run from a fresh checkout.
      - name: Set up Rust musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl

      - name: Generate admin OpenAPI schema
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go run -trimpath ./tools/schema --output .artifacts/admin-openapi.json

      - name: Prepare generated frontend directory
        run: mkdir -p web/src/generated

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Generate frontend API types
        working-directory: web
        run: bun run generate-api

      - name: Typecheck console
        working-directory: web
        run: bun run typecheck

      - name: Build console assets
        working-directory: web
        run: bun run build
      - name: Build native Codex wire helper
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          OPENSSL_STATIC: "1"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          cargo +1.95.0 build \
            --locked \
            --release \
            --manifest-path native/codex-wire/Cargo.toml \
            --target x86_64-unknown-linux-musl \
            --target-dir .artifacts/codex-wire-target
          install -m 0755 \
            .artifacts/codex-wire-target/x86_64-unknown-linux-musl/release/hoorific-codex-wire \
            .artifacts/hoorific-codex-wire
          echo "HOORIFIC_TEST_CODEX_WIRE=$GITHUB_WORKSPACE/.artifacts/hoorific-codex-wire" >> "$GITHUB_ENV"


      - name: Build release, qualification, and verifier executables
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -ldflags='-s -w' -o .artifacts/hoorific ./cmd/hoorific
          go build -trimpath -tags qualification -ldflags='-s -w' -o .artifacts/hoorific-qualification ./cmd/hoorific
          go build -trimpath -ldflags='-s -w' -o .artifacts/hoorific-verify ./tools/verify

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Install SDK and browser dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --requirement tools/verify/sdk/requirements.txt \
            --requirement tools/verify/sdk/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Install Podman and cache qualification images
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y podman
          fi
          podman info
          echo "HOORIFIC_CI_CONTAINER_RUNTIME=podman" >> "$GITHUB_ENV"
          podman pull docker.io/library/postgres:17
          podman pull docker.io/library/redis:7.4-alpine

      - name: Run deterministic standalone qualification
        env:
          HOORIFIC_VERIFY_FAL_IMAGE: docker.io/library/postgres:17
        run: |
          .artifacts/hoorific-verify \
            --binary .artifacts/hoorific \
            --qualification-binary .artifacts/hoorific-qualification \
            --mode standalone \
            --scenario all \
            --output .artifacts/verify-standalone.json

      - name: Run actual Chromium console qualification
        run: |
          set -euo pipefail
          .artifacts/hoorific-verify \
            --binary .artifacts/hoorific \
            --mode standalone \
            --scenario browser \
            --output .artifacts/verify-browser-e2e.json
      - name: Capture public console screenshots
        run: |
          set -euo pipefail
          rm -rf .artifacts/docs-assets
          mkdir -p .artifacts/docs-assets
          python tools/verify/sdk/capture_docs.py \
            --binary .artifacts/hoorific \
            --verifier .artifacts/hoorific-verify \
            --output-dir .artifacts/docs-assets

      - name: Validate public console screenshot set
        env:
          SCREENSHOT_DIR: .artifacts/docs-assets
        run: |
          set -euo pipefail
          expected=(
            console.webp
            console-login.webp
            console-models.webp
            console-model-editor.webp
            console-playground.webp
            console-mobile.webp
          )
          test -d "$SCREENSHOT_DIR"
          test ! -L "$SCREENSHOT_DIR"
          test -z "$(find "$SCREENSHOT_DIR" -mindepth 2 -print -quit)"
          mapfile -t actual < <(find "$SCREENSHOT_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do
            test "${actual[$index]}" = "${expected_sorted[$index]}"
            test -f "$SCREENSHOT_DIR/${actual[$index]}"
            test ! -L "$SCREENSHOT_DIR/${actual[$index]}"
          done

      - name: Upload public console screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoorific-console-screenshots-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            .artifacts/docs-assets/console.webp
            .artifacts/docs-assets/console-login.webp
            .artifacts/docs-assets/console-models.webp
            .artifacts/docs-assets/console-model-editor.webp
            .artifacts/docs-assets/console-playground.webp
            .artifacts/docs-assets/console-mobile.webp


      - name: Run isolated PostgreSQL and Redis qualification
        env:
          HOORIFIC_REDIS_IMAGE: docker.io/library/redis:7.4-alpine
          HOORIFIC_POSTGRES_IMAGE: docker.io/library/postgres:17
        run: |
          set -euo pipefail
          .artifacts/hoorific-verify \
            --binary .artifacts/hoorific \
            --mode cluster \
            --scenario cluster/governance \
            --output .artifacts/verify-cluster-governance.json

      - name: Build and inspect runtime image
        run: |
          set -euo pipefail
          "$HOORIFIC_CI_CONTAINER_RUNTIME" build \
            --tag hoorific:ci \
            --build-arg HOORIFIC_CACHE_NAMESPACE=hoorific-ci \
            .
          entrypoint="$($HOORIFIC_CI_CONTAINER_RUNTIME image inspect --format '{{json .Config.Entrypoint}}' hoorific:ci)"
          user="$($HOORIFIC_CI_CONTAINER_RUNTIME image inspect --format '{{.Config.User}}' hoorific:ci)"
          test "$entrypoint" = '["/usr/local/bin/hoorific"]'
          test "$user" = '10001:10001'
          helper_version="$("$HOORIFIC_CI_CONTAINER_RUNTIME" run --rm --entrypoint /usr/local/bin/hoorific-codex-wire hoorific:ci --version)"
          test "$(jq -er '.protocol' <<<"$helper_version")" -eq 1
          test "$(jq -er '.profile' <<<"$helper_version")" = 'codex-exec'
          test "$(jq -er '.version' <<<"$helper_version")" = '0.153.4'
          jq -er '.openssl | startswith("OpenSSL 3.6.3")' <<<"$helper_version" >/dev/null

      - name: Upload safe qualification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoorific-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            .artifacts/verify-standalone.json
            .artifacts/verify-browser-e2e.json
            .artifacts/verify-cluster-governance.json

  publish-console-screenshots:
    name: Publish console screenshots
    needs: verify
    if: >-
      ${{
        needs.verify.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'openhoo/hoorific'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-console-screenshots-main
      cancel-in-progress: false
    steps:
      - name: Check out originating commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download public console screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoorific-console-screenshots-${{ github.sha }}
          path: .artifacts/public-console-screenshots

      - name: Validate downloaded screenshots
        env:
          SCREENSHOT_DIR: .artifacts/public-console-screenshots
        run: |
          set -euo pipefail
          expected=(
            console.webp
            console-login.webp
            console-models.webp
            console-model-editor.webp
            console-playground.webp
            console-mobile.webp
          )
          test -d "$SCREENSHOT_DIR"
          test ! -L "$SCREENSHOT_DIR"
          while IFS= read -r -d '' path; do
            test ! -L "$path"
            test -f "$path"
          done < <(find "$SCREENSHOT_DIR" -mindepth 1 -print0)
          test -z "$(find "$SCREENSHOT_DIR" -mindepth 2 -print -quit)"
          mapfile -t actual < <(find "$SCREENSHOT_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do
            test "${actual[$index]}" = "${expected_sorted[$index]}"
          done
          for name in "${expected[@]}"; do
            path="$SCREENSHOT_DIR/$name"
            test -f "$path"
            test ! -L "$path"
            test ! -x "$path"
            mode="$(stat -c '%a' -- "$path")"
            case "$mode" in
              *[1357]*)
                echo "refusing executable downloaded content: $path" >&2
                exit 1
                ;;
            esac
            header="$(od -An -tx1 -N 12 -- "$path" | tr -d '[:space:]')"
            test "${header:0:8}" = "52494646"
            test "${header:16:8}" = "57454250"
          done

      - name: Check originating main revision
        id: freshness
        env:
          ORIGIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGIN_SHA"
          git fetch --no-tags origin main
          current="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current" = "$ORIGIN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main advanced beyond $ORIGIN_SHA; skipping screenshot publication"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy validated screenshots
        if: steps.freshness.outputs.current == 'true'
        env:
          SCREENSHOT_DIR: .artifacts/public-console-screenshots
        run: |
          set -euo pipefail
          test -d docs/assets
          test ! -L docs/assets
          for name in \
            console.webp \
            console-login.webp \
            console-models.webp \
            console-model-editor.webp \
            console-playground.webp \
            console-mobile.webp
          do
            destination="docs/assets/$name"
            test ! -L "$destination"
            test ! -d "$destination"
            install -m 0644 -- "$SCREENSHOT_DIR/$name" "$destination"
          done

      - name: Commit and push changed screenshots
        if: steps.freshness.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            docs/assets/console.webp
            docs/assets/console-login.webp
            docs/assets/console-models.webp
            docs/assets/console-model-editor.webp
            docs/assets/console-playground.webp
            docs/assets/console-mobile.webp
          )
          git add -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo "public console screenshots are unchanged; nothing to publish"
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in
              docs/assets/console.webp|\
              docs/assets/console-login.webp|\
              docs/assets/console-models.webp|\
              docs/assets/console-model-editor.webp|\
              docs/assets/console-playground.webp|\
              docs/assets/console-mobile.webp)
                ;;
              *)
                echo "unexpected staged path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh console screenshots"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/main

  publish-image:
    name: Publish GHCR image
    needs:
      - verify
      - publish-console-screenshots
    if: >-
      ${{
        needs.verify.result == 'success' &&
        needs.publish-console-screenshots.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'openhoo/hoorific'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-image-main
      cancel-in-progress: false
    steps:
      - name: Check out CI-validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate current main and select source
        id: source
        env:
          CI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          git fetch --force --no-tags origin main
          current="$(git rev-parse refs/remotes/origin/main)"

          validate_screenshot_delta() {
            local base="$1"
            local head="$2"
            if ! git merge-base --is-ancestor "$base" "$head"; then
              return 1
            fi
            while IFS=$'\t' read -r status path; do
              [ -n "$status" ] || continue
              if [ "$status" != M ]; then
                return 1
              fi
              case "$path" in
                docs/assets/console.webp|\
                docs/assets/console-login.webp|\
                docs/assets/console-models.webp|\
                docs/assets/console-model-editor.webp|\
                docs/assets/console-playground.webp|\
                docs/assets/console-mobile.webp)
                  ;;
                *)
                  return 1
                  ;;
              esac
            done < <(git diff --name-status --no-renames "$base" "$head")
          }

          validate_release_delta() {
            local base="$1"
            local head="$2"
            local version_seen=false
            local changelog_seen=false
            local count=0
            while IFS=$'\t' read -r status path; do
              [ -n "$status" ] || continue
              count=$((count + 1))
              case "$status:$path" in
                M:VERSION)
                  if [ "$version_seen" = true ]; then
                    return 1
                  fi
                  version_seen=true
                  ;;
                A:CHANGELOG.md|M:CHANGELOG.md)
                  if [ "$changelog_seen" = true ]; then
                    return 1
                  fi
                  changelog_seen=true
                  ;;
                *)
                  return 1
                  ;;
              esac
            done < <(git diff --name-status --no-renames "$base" "$head")
            [ "$count" -eq 2 ] &&
              [ "$version_seen" = true ] &&
              [ "$changelog_seen" = true ]
          }

          source="$current"
          if [ "$current" != "$CI_SHA" ] &&
            ! validate_screenshot_delta "$CI_SHA" "$current"; then
            parent="$(git rev-parse --verify "${current}^" 2>/dev/null || true)"
            if [ -z "$parent" ] ||
              ! validate_screenshot_delta "$CI_SHA" "$parent"; then
              echo "::error::main advanced beyond the CI SHA with changes outside the validated screenshot set." >&2
              exit 1
            fi
            if ! validate_release_delta "$parent" "$current"; then
              echo "::error::release retry commit changes paths outside VERSION and CHANGELOG.md." >&2
              exit 1
            fi

            version="$(git show "$current:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::main advanced to an unrecognized release commit; refusing publication." >&2
              exit 1
            fi
            tag="v${version}"
            subject="$(git log -1 --format=%s "$current")"
            if [ "$subject" != "chore(release): hoorific ${version}" ]; then
              echo "::error::release retry commit subject does not match VERSION." >&2
              exit 1
            fi
            if ! git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"; then
              echo "::error::release retry tag ${tag} is not available on origin." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse --verify "${tag}^{commit}" 2>/dev/null || true)"
            if [ "$tag_commit" != "$current" ]; then
              echo "::error::release retry tag ${tag} does not point at current main." >&2
              exit 1
            fi
            echo "::notice::resuming the verified Hooversion release at ${current}"
          fi

          echo "source_sha=$source" >> "$GITHUB_OUTPUT"


      - name: Check out selected main source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --force -B main "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"

      - name: Run Hooversion release
        id: release
        uses: openhoo/hooversion/actions/release@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: "1.1.1"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          github: true

      - name: Resolve release metadata and image tags
        id: image-metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOOVERSION_PUBLISHED: ${{ steps.release.outputs.published }}
          HOOVERSION_VERSION: ${{ steps.release.outputs.version }}
          HOOVERSION_TAG: ${{ steps.release.outputs.tag }}
          HOOVERSION_RELEASES_JSON: ${{ steps.release.outputs['releases-json'] }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short_sha="${commit:0:7}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_count="$(jq -er 'if type == "array" then length else error("releases-json must be an array") end' <<<"$HOOVERSION_RELEASES_JSON")"

          case "$HOOVERSION_PUBLISHED" in
            false)
              test "$release_count" -eq 0
              test -z "$HOOVERSION_VERSION"
              test -z "$HOOVERSION_TAG"
              ;;
            true)
              test "$release_count" -eq 1
              version="$HOOVERSION_VERSION"
              tag="$HOOVERSION_TAG"
              if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Hooversion returned an invalid version." >&2
                exit 1
              fi
              test "$tag" = "v${version}"
              test "$(tr -d '[:space:]' < VERSION)" = "$version"
              test "$(jq -er '.[0].version' <<<"$HOOVERSION_RELEASES_JSON")" = "$version"
              test "$(jq -er '.[0].tag' <<<"$HOOVERSION_RELEASES_JSON")" = "$tag"
              test "$(git rev-parse --verify "${tag}^{commit}")" = "$commit"
              test "$(git log -1 --format=%s "$commit")" = "chore(release): hoorific ${version}"
              minor="${version%.*}"
              if [[ ! "$minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
                echo "::error::cannot derive a safe minor image tag." >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::unexpected Hooversion published output: ${HOOVERSION_PUBLISHED}" >&2
              exit 1
              ;;
          esac

          {
            echo "commit=$commit"
            echo "short_sha=$short_sha"
            echo "published=$HOOVERSION_PUBLISHED"
            echo "version=${HOOVERSION_VERSION:-}"
            echo "tag=${HOOVERSION_TAG:-}"
            echo "tags<<EOF"
            echo "${image}:sha-${short_sha}"
            echo "${image}:latest"
            if [ "$HOOVERSION_PUBLISHED" = true ]; then
              echo "${image}:${HOOVERSION_VERSION}"
              echo "${image}:${minor}"
            fi
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${commit}"
            if [ "$HOOVERSION_PUBLISHED" = true ]; then
              echo "org.opencontainers.image.version=${HOOVERSION_VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          provenance: false
          sbom: false
