name: hoorific

x-runtime: &runtime
  image: ${HOORIFIC_IMAGE:-hoorific:local}
  build:
    context: .
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770
  volumes:
    - type: bind
      source: ${HOORIFIC_CONFIG:?Set HOORIFIC_CONFIG to an absolute config JSON path}
      target: /etc/hoorific/config.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${HOORIFIC_MASTER_KEY:?Set HOORIFIC_MASTER_KEY to an absolute master-key path}
      target: /run/secrets/hoorific-master-key
      read_only: true
      bind:
        create_host_path: false
    - data:/var/lib/hoorific

services:
  migrate:
    <<: *runtime
    command: [migrate, --config, /etc/hoorific/config.json]
    restart: "no"
  gateway:
    <<: *runtime
    command: [serve, --config, /etc/hoorific/config.json]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${HOORIFIC_BIND_ADDRESS:-127.0.0.1}:${HOORIFIC_INFERENCE_PORT:-8080}:8080"
      - "127.0.0.1:${HOORIFIC_MANAGEMENT_PORT:-8081}:8081"

volumes:
  data:
